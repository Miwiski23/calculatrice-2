name: Compiler l'APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparer le projet
        run: |
          mkdir -p www assets
          cp index.html icon-192.png icon-512.png www/
          cp icon-only.png icon-foreground.png icon-background.png assets/
          cat > package.json <<'JSON'
          {
            "name": "calculatrice-de-bureau",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/cli": "^8.0.0",
              "@capacitor/core": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "ch.michael.calculatrice",
            "appName": "Calculatrice",
            "webDir": "www",
            "backgroundColor": "#06264d",
            "android": { "backgroundColor": "#06264d" }
          }
          JSON
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --assetPath assets
      - run: npx cap sync android
      - name: Compiler
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calculatrice-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
